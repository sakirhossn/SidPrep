services:
  postgres:
    image: postgres:16-alpine
    container_name: sidprep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sidprep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidprep_prod_secure_password_replace_me}
      POSTGRES_DB: ${POSTGRES_DB:-sidprep_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - '127.0.0.1:5432:5432'
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 512M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sidprep_user} -d ${POSTGRES_DB:-sidprep_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sidprep_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sidprep_user}:${POSTGRES_PASSWORD:-sidprep_prod_secure_password_replace_me}@postgres:5432/${POSTGRES_DB:-sidprep_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://sidprep.in,https://api.sidprep.in}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-./uploads}
      R2_ENDPOINT: ${R2_ENDPOINT:-https://cbf7a4a2f0c78ae217205ffb1064ea54.r2.cloudflarestorage.com}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-1ffe7c761ee357af0998ece167f0ce6e}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-5a8e1264ec4ab149ecafb317eb1397ea8c0b9e9810109c87d8ca7733ba58e661}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-sidprep-cdn-prod}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:-https://cdn.sidprep.in}
      R2_MONTHLY_QUOTA_BYTES: ${R2_MONTHLY_QUOTA_BYTES:-10737418240}
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER:-c0cb63001@smtp-brevo.com}
      BREVO_SMTP_PASS: ${BREVO_SMTP_PASS:-xsmtpsib-97074ae277161f493015be656141d02456dbb898dce704165e72d529213940fd-LSNXeocw1KG8vYNm}
      BREVO_API_KEY: ${BREVO_API_KEY:-xkeysib-mock-local}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-no-reply@sidprep.in}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-SidPrep}
      NEWS_TIMEZONE: ${NEWS_TIMEZONE:-Asia/Kolkata}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-sksakirhossain8@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminSecurePass123!}
    volumes:
      - ./uploads:/app/apps/api/uploads
    ports:
      - '127.0.0.1:4000:4000'
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 384M
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: sidprep_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:4000/v1
      INTERNAL_API_URL: http://api:4000/v1
    ports:
      - '127.0.0.1:3000:3000'
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M

  caddy:
    image: caddy:2-alpine
    container_name: sidprep_caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
